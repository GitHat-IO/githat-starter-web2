# Test on every push; deploy to YOUR OWN Cloudflare account when you opt in.
# This runs on your repository's GitHub Actions minutes (free for public repos) and
# deploys with YOUR Cloudflare credentials. GitHat runs no build and holds no secret of yours.
#
# To turn deploys on, in this repo's Settings:
#   Variables:  DEPLOY_TARGET = cloudflare
#   Secrets:    CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID   (your Cloudflare account)
#
# NOTE: the deploy job has not been run by GitHat. It follows OpenNext's Cloudflare adapter;
# if the adapter's command changes, edit the last step. The test job is the part to trust.
name: test-and-deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_TARGET == 'cloudflare'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Deploy to your Cloudflare account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes @opennextjs/cloudflare@latest deploy
